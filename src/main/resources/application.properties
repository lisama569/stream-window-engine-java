# 窗口长度（毫秒）
engine.window-size-millis=60000
# 允许迟到时长（毫秒）：watermark = 已见最大事件时间 - 该值
engine.allowed-lateness-millis=30000
# 同时打开的最大窗口数，超过则返回 BACKPRESSURE
engine.max-open-windows=1024
# 去重表最大条目数，超过则返回 BACKPRESSURE
engine.max-dedup-entries=100000
# 保留的已确定窗口结果最大条数
engine.max-retained-results=10000
# 本地检查点文件路径
engine.checkpoint-path=data/checkpoint.json
# 启动时是否必须存在有效检查点（true 时缺失将拒绝启动）
engine.checkpoint-required=false
# 同时跟踪的最大来源数，超过则返回 BACKPRESSURE
engine.max-sources=4096
