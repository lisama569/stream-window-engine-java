spring.application.name=stream-window-engine

# 滚动窗口大小（毫秒）
stream-engine.window-size-ms=60000
# 允许迟到时长（毫秒）
stream-engine.allowed-lateness-ms=30000
# 活跃+宽限窗口数量上限（背压阈值）
stream-engine.max-buffered-windows=10000
# 去重索引容量上限（背压阈值）
stream-engine.max-seen-event-ids=1000000
# 已定版结果保留上限
stream-engine.max-stored-results=10000
# 死信日志容量上限
stream-engine.max-dead-letters=10000
# 检查点目录
stream-engine.checkpoint-dir=data/checkpoints
# 启动时是否必须存在检查点
stream-engine.checkpoint-required-on-startup=false
# 每次摄取后是否落检查点
stream-engine.checkpoint-on-ingest=true
